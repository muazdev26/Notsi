plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'app.cash.sqldelight'
    id("com.google.devtools.ksp")
    id 'com.google.dagger.hilt.android'
}

android {
    namespace 'com.muazdev.notsi'
    compileSdk 36

    defaultConfig {
        applicationId "com.muazdev.notsi"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "com.muazdev.notsi.HiltTestRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.18.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'

    implementation("app.cash.sqldelight:android-driver:2.3.2")
    implementation("app.cash.sqldelight:coroutines-extensions:2.3.2")

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'

    implementation 'com.google.dagger:hilt-android:2.59.2'
    ksp 'com.google.dagger:hilt-compiler:2.59.2'

    implementation 'androidx.navigation:navigation-fragment-ktx:2.9.8'
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:2.10.0"

    testImplementation "app.cash.sqldelight:sqlite-driver:2.3.2"
    testImplementation "app.cash.turbine:turbine:1.2.1"
    // Local Unit Tests
    implementation "androidx.test:core:1.7.0"
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.hamcrest:hamcrest-all:1.3"
    testImplementation "androidx.arch.core:core-testing:2.2.0"
    testImplementation "org.robolectric:robolectric:4.16.1"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.2"
    testImplementation "com.google.truth:truth:1.4.5"
    testImplementation "org.mockito:mockito-core:5.23.0"

    // Instrumented Unit Tests
    androidTestImplementation "junit:junit:4.13.2"
    androidTestImplementation "com.linkedin.dexmaker:dexmaker-mockito:2.28.6"
    androidTestImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.2"
    androidTestImplementation "androidx.arch.core:core-testing:2.2.0"
    androidTestImplementation "com.google.truth:truth:1.4.5"
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation "org.mockito:mockito-core:5.23.0"
    androidTestImplementation 'com.google.dagger:hilt-android-testing:2.59.2'
    androidTestImplementation 'androidx.test.espresso:espresso-contrib:3.7.0'
    kspAndroidTest 'com.google.dagger:hilt-android-compiler:2.59.2'
    testAnnotationProcessor 'com.google.dagger:hilt-android-compiler:2.59.2'
    testImplementation 'com.google.dagger:hilt-android-testing:2.59.2'
    debugImplementation 'androidx.fragment:fragment-testing:1.8.9'
}

sqldelight {
    databases {
        register("NotesDb") {
            packageName.set("com.muazdev.notsi")
            verifyMigrations.set(true)
            schemaOutputDirectory.set(file("src/main/sqldelight/migrations"))
        }
    }
}